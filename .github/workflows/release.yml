name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r firmware/requirements.txt
      - run: python -m unittest discover -s headunit/tools/tests -v
      - run: python -m unittest discover -s firmware/tests -v
        env:
          PYTHONPATH: firmware
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - name: Prepare private signing file
        run: python headunit/tools/prepare_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Install native cast interoperability test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc ffmpeg
      - name: Test and build signed APK
        run: ./headunit/gradlew -p headunit :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --console=plain
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/openbyddisplay-release.p12
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify and assemble public assets
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs headunit/app/build/outputs/apk/release/app-release.apk
          python headunit/tools/release_assets.py
      - name: Publish to GitHub Releases
        run: gh release create "$GITHUB_REF_NAME" headunit/artifacts/* --verify-tag --title "OpenBYDDisplay $GITHUB_REF_NAME · 测试版" --notes-file docs/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Remove runner signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/openbyddisplay-release.p12"
